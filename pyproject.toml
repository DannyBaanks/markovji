[project]
name = "markovji"
version = "1.0.0"
description = "Algoritmo de Markov esotérico con sintaxis kaomoji — Turing-completo, unario, reescritura"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "DannyBaanks"}
]
keywords = ["esolang", "markov", "rewriting", "turing-complete", "kaomoji", "unary"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Interpreters",
]

[project.scripts]
markovji = "markovji:main"

[project.urls]
Repository = "https://github.com/DannyBaanks/Markovji"
Issues = "https://github.com/DannyBaanks/Markovji/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["markovji*"]
exclude = ["ejemplos*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true